<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harvin AI Scanner</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- ── Branded Header ──────────────────────────────────────────────── -->
  <div class="header">
    <div class="header-top">
      <div class="logo-row">
        <svg class="logo-icon" viewBox="0 0 36 36" fill="none">
          <rect width="36" height="36" rx="10" fill="white" fill-opacity="0.15"/>
          <text x="18" y="24" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="20" fill="white">H</text>
        </svg>
        <span class="logo-text">Harvin AI</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="refresh-btn" title="Re-scan">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M13.65 2.35A8 8 0 103.34 13.66" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M14 6V2h-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <div class="site-url-bar">
      <svg class="globe-icon" width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.2"/><path d="M1.5 8h13M8 1.5c-2 2-2.5 4-2.5 6.5s.5 4.5 2.5 6.5c2-2 2.5-4 2.5-6.5S10 3.5 8 1.5z" stroke="currentColor" stroke-width="1.2"/></svg>
      <span class="site-url" id="site-url">Loading...</span>
    </div>
  </div>


  <!-- ── Tab Bar ─────────────────────────────────────────────────────── -->
  <div class="tab-bar">
    <button class="tab active" id="tab-tech" data-tab="tech">Technologies</button>
    <button class="tab" id="tab-info" data-tab="info">More Info</button>
    <button class="export-btn" id="export-btn" title="Export results">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2 10v3a1 1 0 001 1h10a1 1 0 001-1v-3M8 2v8M5 5l3-3 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Export
    </button>
  </div>

  <!-- ── Initial State (before scan) ─────────────────────────────────── -->
  <div class="initial-state" id="initial-state">
    <div class="initial-icon">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <rect x="4" y="4" width="40" height="40" rx="12" stroke="#C94C1E" stroke-width="2" stroke-dasharray="4 3"/>
        <circle cx="24" cy="24" r="8" stroke="#C94C1E" stroke-width="2"/>
        <circle cx="24" cy="24" r="2.5" fill="#C94C1E"/>
      </svg>
    </div>
    <p class="initial-title">Scan this website</p>
    <p class="initial-desc">Detect technologies, analytics, payments, and more.</p>
    <button class="scan-btn" id="scan-btn">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 5V3.5A1.5 1.5 0 013.5 2H5M11 2h1.5A1.5 1.5 0 0114 3.5V5M14 11v1.5a1.5 1.5 0 01-1.5 1.5H11M5 14H3.5A1.5 1.5 0 012 12.5V11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="8" r="2.5" stroke="currentColor" stroke-width="1.3"/></svg>
      Scan Now
    </button>
  </div>

  <!-- ── Loading State ───────────────────────────────────────────────── -->
  <div class="loading-state hidden" id="loading-state">
    <div class="spinner"></div>
    <p class="loading-text">Analyzing tech stack...</p>
    <div class="loader-bar"><div class="loader-fill"></div></div>
  </div>

  <!-- ── Error State ─────────────────────────────────────────────────── -->
  <div class="error-state hidden" id="error-state">
    <svg class="error-icon" width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8" stroke="#ef4444" stroke-width="1.5"/><path d="M10 6.5v4M10 13.5h.01" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/></svg>
    <p class="error-text" id="error-text"></p>
  </div>

  <!-- ── Results: Technologies Tab ───────────────────────────────────── -->
  <div class="results hidden" id="results">
    <div class="tech-summary" id="tech-summary"></div>
    <div class="categories" id="categories"></div>
  </div>

  <!-- ── Results: More Info Tab ──────────────────────────────────────── -->
  <div class="info-panel hidden" id="info-panel">
    <div class="info-content" id="info-content">
      <p class="info-empty">Scan first to see company details.</p>
    </div>
  </div>

  <!-- ── Footer ──────────────────────────────────────────────────────── -->
  <div class="footer">
    <span class="footer-brand">Harvin AI</span>
    <span class="footer-sep">&middot;</span>
    <a href="https://harvin.ai" target="_blank" rel="noopener">harvin.ai</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
