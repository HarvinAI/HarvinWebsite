<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harvin AI Scanner</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- ── Branded Header ──────────────────────────────────────────────── -->
  <div class="header">
    <div class="header-top">
      <div class="logo-row">
        <img class="logo-icon" src="icons/icon48.png" alt="Harvin AI" />
        <span class="logo-text">Harvin AI</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="refresh-btn" title="Re-scan">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 2v6h-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 12a9 9 0 0115.36-6.36L21 8M3 22v-6h6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 12a9 9 0 01-15.36 6.36L3 16" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <div class="site-url-bar">
      <svg class="globe-icon" width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.2"/><path d="M1.5 8h13M8 1.5c-2 2-2.5 4-2.5 6.5s.5 4.5 2.5 6.5c2-2 2.5-4 2.5-6.5S10 3.5 8 1.5z" stroke="currentColor" stroke-width="1.2"/></svg>
      <span class="site-url" id="site-url">Loading...</span>
    </div>
  </div>

  <!-- ── Tab Bar ─────────────────────────────────────────────────────── -->
  <div class="tab-bar">
    <button class="tab active" id="tab-tech" data-tab="tech">Technologies</button>
    <button class="tab" id="tab-info" data-tab="info">More Info</button>
  </div>

  <!-- ── Loading State ───────────────────────────────────────────────── -->
  <div class="loading-state" id="loading-state">
    <div class="spinner"></div>
    <p class="loading-text">Analyzing tech stack...</p>
    <div class="loader-bar"><div class="loader-fill"></div></div>
  </div>

  <!-- ── Error State ─────────────────────────────────────────────────── -->
  <div class="error-state hidden" id="error-state">
    <svg class="error-icon" width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8" stroke="#ef4444" stroke-width="1.5"/><path d="M10 6.5v4M10 13.5h.01" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/></svg>
    <p class="error-text" id="error-text"></p>
  </div>

  <!-- ── Results: Technologies Tab ───────────────────────────────────── -->
  <div class="results hidden" id="results">
    <div class="tech-summary" id="tech-summary"></div>
    <div class="categories" id="categories"></div>
  </div>

  <!-- ── Results: More Info Tab ──────────────────────────────────────── -->
  <div class="info-panel hidden" id="info-panel">
    <div class="info-content" id="info-content">
      <p class="info-empty">Scan a site to see company details.</p>
    </div>
  </div>

  <!-- ── Footer ──────────────────────────────────────────────────────── -->
  <div class="footer">
    <span class="footer-brand">Harvin AI</span>
    <span class="footer-sep">&middot;</span>
    <a href="https://harvin.ai" target="_blank" rel="noopener">harvin.ai</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
