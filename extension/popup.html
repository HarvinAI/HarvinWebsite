<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harvin AI TechScanner</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- ── Header ────────────────────────────────────────────────────────── -->
  <div class="header">
    <div class="header-left">
      <img src="icons/icon48.png" alt="Harvin" class="header-logo" />
      <div class="header-text">
        <span class="header-title">TechScanner</span>
        <span class="header-subtitle" id="site-url">Loading...</span>
      </div>
    </div>
    <button class="refresh-btn" id="refresh-btn" title="Re-scan">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M21 2v6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 12a9 9 0 0115.36-6.36L21 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 22v-6h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 12a9 9 0 01-15.36 6.36L3 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <!-- ── Loading State ───────────────────────────────────────────────── -->
  <div class="loading-state" id="loading-state">
    <div class="spinner"></div>
    <p class="loading-text">Detecting technologies...</p>
  </div>

  <!-- ── Error State ─────────────────────────────────────────────────── -->
  <div class="error-state hidden" id="error-state">
    <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8" stroke="#dc2626" stroke-width="1.5"/><path d="M10 6.5v4M10 13.5h.01" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/></svg>
    <p class="error-text" id="error-text"></p>
  </div>

  <!-- ── Results ─────────────────────────────────────────────────────── -->
  <div class="results hidden" id="results">
    <!-- Summary bar -->
    <div class="summary-bar" id="summary-bar"></div>

    <!-- Company info (collapsible) -->
    <div class="company-info hidden" id="company-info"></div>

    <!-- Tech categories -->
    <div class="categories" id="categories"></div>
  </div>

  <!-- ── Empty State ─────────────────────────────────────────────────── -->
  <div class="empty-state hidden" id="empty-state">
    <p>No technologies detected</p>
  </div>

  <!-- ── Footer ──────────────────────────────────────────────────────── -->
  <div class="footer">
    <span>Powered by</span>
    <a href="https://harvin.ai" target="_blank" rel="noopener">Harvin AI</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
