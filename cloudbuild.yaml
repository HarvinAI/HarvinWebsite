# Cloud Build pipeline for HarvinAI on Cloud Run.
#
# Connect this file to a GitHub trigger (one-time):
#
#   gcloud beta builds triggers create github \
#     --name=deploy-main \
#     --repo-name=HarvinWebsite --repo-owner=HarvinAI \
#     --branch-pattern=^main$ \
#     --build-config=cloudbuild.yaml
#
# After that, every push to main builds + deploys automatically.

substitutions:
  _REGION: asia-south1
  _SERVICE: harvinai-web
  _REPO: harvinai
  _IMAGE: web
  # User-defined tag. Default is "latest" for ad-hoc manual builds.
  # For SHA-tagged deploys, override: --substitutions=_TAG=$(git rev-parse --short HEAD)
  # (Built-in $SHORT_SHA is only auto-populated by git-triggered builds, not by
  # `gcloud builds submit` from local — that's why we use a user-defined _TAG.)
  _TAG: latest

steps:
  # ── 1. Build the image ────────────────────────────────────────────────
  - id: docker-build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_TAG}
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest
      - .

  # ── 2. Push to Artifact Registry ──────────────────────────────────────
  - id: docker-push-tag
    name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_TAG}']
  - id: docker-push-latest
    name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest']

  # ── 3. Deploy to Cloud Run ────────────────────────────────────────────
  - id: deploy
    name: gcr.io/cloud-builders/gcloud
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --cpu=2
      - --memory=2Gi
      - --min-instances=0
      - --max-instances=10
      - --concurrency=80
      - --timeout=900
      - --update-secrets=MONGO_URI=MONGO_URI:latest,ADMIN_API_TOKEN=ADMIN_API_TOKEN:latest,NEXTAUTH_SECRET=NEXTAUTH_SECRET:latest,NEXTAUTH_URL=NEXTAUTH_URL:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,GROQ_API_KEY=GROQ_API_KEY:latest,GOOGLE_API_KEY=GOOGLE_API_KEY:latest,SMTP_HOST=SMTP_HOST:latest,SMTP_PORT=SMTP_PORT:latest,SMTP_USER=SMTP_USER:latest,SMTP_PASS=SMTP_PASS:latest,FROM_NAME=FROM_NAME:latest,ADMIN_EMAIL=ADMIN_EMAIL:latest

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_TAG}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s
